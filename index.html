<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BAINI - Flappy Bird Fullscreen</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Memaksa Layar Penuh Tanpa Scrollbar */
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050814;
      color: #fff;
    }

    /* Antarmuka Melayang (HUD) dengan Branding BAINI */
    .hud {
      position: absolute;
      top: 15px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }

    .brand-title {
      display: flex;
      flex-direction: column;
    }

    .brand-name {
      font-size: 0.95rem;
      letter-spacing: 4px;
      color: #ff007f;
      text-transform: uppercase;
      font-weight: bold;
      text-shadow: 0 0 8px #ff007f;
    }

    h1 {
      font-size: 2.2rem;
      color: #00f0ff;
      text-shadow: 0 0 10px #00f0ff, 0 0 20px #00f0ff;
    }

    .score-board {
      font-size: 1.2rem;
      display: flex;
      gap: 20px;
      background: rgba(0, 0, 0, 0.6);
      padding: 10px 25px;
      border-radius: 20px;
      border: 1px solid rgba(0, 240, 255, 0.4);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
      backdrop-filter: blur(5px);
    }

    .score-board span {
      color: #ffd700;
      font-weight: bold;
    }

    /* Canvas Game Memenuhi Seluruh Layar Desktop */
    #gameCanvas {
      width: 100vw;
      height: 100vh;
      display: block;
      background: #0a0f24;
    }

    .controls-hint {
      position: absolute;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.95rem;
      color: #aaa;
      background: rgba(0, 0, 0, 0.6);
      padding: 6px 16px;
      border-radius: 15px;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="hud">
    <div class="brand-title">
      <span class="brand-name">WEBSITE GAME BAINI</span>
      <h1>BAINI FLAPPY BIRD</h1>
    </div>

    <div class="score-board">
      <div>Skor: <span id="scoreText">0</span></div>
      <div>Rekor Baini: <span id="highScoreText">0</span></div>
    </div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <div class="controls-hint">Tekan <b>SPASI</b> atau <b>Panah Atas</b> di keyboard untuk terbang!</div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreText = document.getElementById('scoreText');
    const highScoreText = document.getElementById('highScoreText');

    let score = 0;
    let highScore = localStorage.getItem('bainiFlappyHighScore') || 0;
    let gameAnimationId = null;
    let isGameRunning = true;
    let frameCount = 0;

    highScoreText.textContent = highScore;

    // Web Audio API untuk Efek Suara
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, type = 'sine', duration = 0.08) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    let bird;
    let pipes = [];

    class Bird {
      constructor() {
        this.x = 150;
        this.y = canvas.height / 2;
        this.radius = 16;
        this.gravity = 0.45;
        this.velocity = 0;
        this.jumpPower = -8.5;
      }

      draw() {
        // Burung Neon Glowing
        ctx.shadowBlur = 18;
        ctx.shadowColor = '#00f0ff';
        ctx.fillStyle = '#00f0ff';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();

        // Mata Burung
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(this.x + 6, this.y - 4, 4, 0, Math.PI * 2);
        ctx.fill();

        // Paruh Burung
        ctx.shadowColor = '#ff007f';
        ctx.fillStyle = '#ff007f';
        ctx.beginPath();
        ctx.moveTo(this.x + this.radius, this.y - 2);
        ctx.lineTo(this.x + this.radius + 10, this.y + 2);
        ctx.lineTo(this.x + this.radius, this.y + 6);
        ctx.closePath();
        ctx.fill();

        ctx.shadowBlur = 0;
      }

      flap() {
        this.velocity = this.jumpPower;
        playBeep(600, 'triangle', 0.06);
      }

      update() {
        this.velocity += this.gravity;
        this.y += this.velocity;

        // Cek Jatuh ke Dasar / Keluar Langit
        if (this.y + this.radius >= canvas.height || this.y - this.radius <= 0) {
          gameOver();
        }
      }
    }

    class Pipe {
      constructor() {
        this.x = canvas.width;
        this.width = 80;
        this.gap = 210; // Ukuran celah pilar
        this.topHeight = Math.random() * (canvas.height - this.gap - 160) + 80;
        this.bottomY = this.topHeight + this.gap;
        this.speed = 4;
        this.passed = false;
      }

      draw() {
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#ff007f';
        ctx.fillStyle = '#ff007f';

        // Pilar Atas
        ctx.fillRect(this.x, 0, this.width, this.topHeight);
        
        // Pilar Bawah
        ctx.fillRect(this.x, this.bottomY, this.width, canvas.height - this.bottomY);

        ctx.shadowBlur = 0;
      }

      update() {
        this.x -= this.speed;
      }
    }

    function initGame() {
      resizeCanvas();
      bird = new Bird();
      pipes = [];
      score = 0;
      frameCount = 0;
      scoreText.textContent = score;
      isGameRunning = true;

      if (gameAnimationId) cancelAnimationFrame(gameAnimationId);
      animate();
    }

    function gameOver() {
      playBeep(130, 'sawtooth', 0.4);
      isGameRunning = false;
      cancelAnimationFrame(gameAnimationId);

      ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.shadowBlur = 15;
      ctx.shadowColor = '#ff007f';
      ctx.fillStyle = '#ff007f';
      ctx.font = 'bold 42px Segoe UI';
      ctx.textAlign = 'center';
      ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 15);

      ctx.shadowBlur = 0;
      ctx.fillStyle = '#fff';
      ctx.font = '20px Segoe UI';
      ctx.fillText('Tekan tombol SPASI untuk mencoba lagi', canvas.width / 2, canvas.height / 2 + 30);
    }

    function animate() {
      if (!isGameRunning) return;

      // Bersihkan Canvas
      ctx.fillStyle = '#0a0f24';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Munculkan Pilar Baru Secara Berkala
      frameCount++;
      if (frameCount % 105 === 0) {
        pipes.push(new Pipe());
      }

      // Update & Gambar Pilar
      pipes.forEach((pipe, index) => {
        pipe.update();
        pipe.draw();

        // Cek Tabrakan Burung dengan Pilar
        if (
          bird.x + bird.radius > pipe.x &&
          bird.x - bird.radius < pipe.x + pipe.width &&
          (bird.y - bird.radius < pipe.topHeight || bird.y + bird.radius > pipe.bottomY)
        ) {
          gameOver();
        }

        // Cek Melewati Pilar & Tambah Skor
        if (!pipe.passed && pipe.x + pipe.width < bird.x) {
          pipe.passed = true;
          score++;
          scoreText.textContent = score;
          playBeep(900, 'sine', 0.1);

          if (score > highScore) {
            highScore = score;
            highScoreText.textContent = highScore;
            localStorage.setItem('bainiFlappyHighScore', highScore);
          }
        }

        // Hapus Pilar yang Sudah Keluar Layar
        if (pipe.x + pipe.width < 0) {
          pipes.splice(index, 1);
        }
      });

      bird.update();
      bird.draw();

      gameAnimationId = requestAnimationFrame(animate);
    }

    // Input Keyboard Otomatis
    window.addEventListener('keydown', e => {
      if (e.code === 'Space' || e.key === 'ArrowUp') {
        e.preventDefault();
        if (isGameRunning) {
          bird.flap();
        } else {
          initGame();
        }
      }
    });

    window.addEventListener('resize', () => {
      resizeCanvas();
      if (!isGameRunning) {
        ctx.fillStyle = '#0a0f24';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }
    });

    // Jalankan Game Otomatis Saat Dimuat
    window.onload = initGame;
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BAINI - Flappy Bird HD Multi-Bioma</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;
    }

    .hud {
      position: absolute;
      top: 15px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }

    .brand-title {
      display: flex;
      flex-direction: column;
    }

    .brand-name {
      font-size: 0.95rem;
      letter-spacing: 4px;
      color: #ff007f;
      text-transform: uppercase;
      font-weight: bold;
      text-shadow: 0 0 8px rgba(255, 0, 127, 0.6);
    }

    h1 {
      font-size: 2.2rem;
      color: #ffffff;
      text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.8);
    }

    .score-board {
      font-size: 1.2rem;
      display: flex;
      gap: 20px;
      background: rgba(0, 0, 0, 0.6);
      padding: 10px 25px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(5px);
    }

    .score-board span {
      color: #ffd700;
      font-weight: bold;
    }

    #gameCanvas {
      width: 100vw;
      height: 100vh;
      display: block;
    }

    .controls-hint {
      position: absolute;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.95rem;
      color: #fff;
      background: rgba(0, 0, 0, 0.6);
      padding: 6px 16px;
      border-radius: 15px;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="hud">
    <div class="brand-title">
      <span class="brand-name">WEBSITE GAME BAINI</span>
      <h1>BAINI FLAPPY BIRD HD</h1>
    </div>

    <div class="score-board">
      <div>Lokasi: <span id="locationText" style="color:#00f0ff">Taman Sungai</span></div>
      <div>Skor: <span id="scoreText">0</span></div>
      <div>Rekor Baini: <span id="highScoreText">0</span></div>
    </div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <div class="controls-hint">Tekan <b>SPASI</b> atau <b>Panah Atas</b> untuk terbang!</div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreText = document.getElementById('scoreText');
    const highScoreText = document.getElementById('highScoreText');
    const locationText = document.getElementById('locationText');

    const TARGET_SCORE = 20;
    let score = 0;
    let highScore = localStorage.getItem('bainiFlappyHighScore') || 0;
    let gameAnimationId = null;
    let isGameRunning = true;
    let frameCount = 0;

    highScoreText.textContent = highScore;

    // SISTEM MEMUAT GAMBAR HD TEKSTUR
    const images = {};
    const imageSources = {
      bgPark: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1200&q=80',
      bgDesert: 'https://images.unsplash.com/photo-1509316975850-ff9c5deb0cd9?auto=format&fit=crop&w=1200&q=80',
      bgSnow: 'https://images.unsplash.com/photo-1483921020237-2ff51e8e4b22?auto=format&fit=crop&w=1200&q=80',
      bgCity: 'https://images.unsplash.com/photo-1519501025264-65ba15a82390?auto=format&fit=crop&w=1200&q=80'
    };

    let loadedImagesCount = 0;
    const totalImages = Object.keys(imageSources).length;

    for (let key in imageSources) {
      images[key] = new Image();
      images[key].src = imageSources[key];
      images[key].onload = () => {
        loadedImagesCount++;
      };
    }

    // Web Audio API
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, type = 'sine', duration = 0.08) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function playWinSound() {
      playBeep(523.25, 'triangle', 0.15);
      setTimeout(() => playBeep(659.25, 'triangle', 0.15), 150);
      setTimeout(() => playBeep(783.99, 'triangle', 0.15), 300);
      setTimeout(() => playBeep(1046.50, 'triangle', 0.3), 450);
    }

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    let bird;
    let pipes = [];
    let fireworks = [];

    class Bird {
      constructor() {
        this.x = 150;
        this.y = canvas.height / 2;
        this.radius = 18;
        this.gravity = 0.45;
        this.velocity = 0;
        this.jumpPower = -8.5;
      }

      draw() {
        // Karakter Burung dengan Efek Gradien 3D & Bayangan HD
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(Math.min(Math.PI / 4, Math.max(-Math.PI / 4, this.velocity * 0.08)));

        // Shadow HD
        ctx.shadowBlur = 12;
        ctx.shadowColor = 'rgba(0,0,0,0.4)';

        // Badan Burung Gradasi 3D
        let birdGrad = ctx.createRadialGradient(-4, -4, 2, 0, 0, this.radius);
        birdGrad.addColorStop(0, '#ffee55');
        birdGrad.addColorStop(0.8, '#ff9900');
        birdGrad.addColorStop(1, '#cc6600');

        ctx.fillStyle = birdGrad;
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.shadowBlur = 0;

        // Sayap Bertekstur
        ctx.fillStyle = '#ffcc00';
        ctx.beginPath();
        ctx.ellipse(-6, 2, 9, 6, 0.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#e67e22';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // Mata 3D
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(6, -5, 6, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#111111';
        ctx.beginPath();
        ctx.arc(8, -5, 2.5, 0, Math.PI * 2);
        ctx.fill();

        // Paruh
        let beakGrad = ctx.createLinearGradient(10, 0, 22, 0);
        beakGrad.addColorStop(0, '#ff4d4d');
        beakGrad.addColorStop(1, '#b30000');
        ctx.fillStyle = beakGrad;
        ctx.beginPath();
        ctx.moveTo(10, -2);
        ctx.lineTo(22, 2);
        ctx.lineTo(10, 7);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
      }

      flap() {
        this.velocity = this.jumpPower;
        playBeep(600, 'triangle', 0.06);
      }

      update() {
        this.velocity += this.gravity;
        this.y += this.velocity;

        if (this.y + this.radius >= canvas.height - 40 || this.y - this.radius <= 0) {
          gameOver();
        }
      }
    }

    class Pipe {
      constructor() {
        this.x = canvas.width;
        this.width = 85;
        this.gap = 210;
        this.topHeight = Math.random() * (canvas.height - this.gap - 250) + 60;
        this.bottomY = this.topHeight + this.gap;
        this.speed = 4;
        this.passed = false;
      }

      draw() {
        // Efek Tekstur Metalik HD pada Pilar
        let mainGrad = ctx.createLinearGradient(this.x, 0, this.x + this.width, 0);
        
        if (score < 5) { // Pilar Hutan/Taman
          mainGrad.addColorStop(0, '#1b5e20');
          mainGrad.addColorStop(0.3, '#4caf50');
          mainGrad.addColorStop(0.7, '#81c784');
          mainGrad.addColorStop(1, '#1b5e20');
        } else if (score >= 5 && score < 10) { // Pilar Gurun Batu
          mainGrad.addColorStop(0, '#7f5539');
          mainGrad.addColorStop(0.3, '#ddb892');
          mainGrad.addColorStop(0.7, '#e6ccb2');
          mainGrad.addColorStop(1, '#7f5539');
        } else if (score >= 10 && score < 15) { // Pilar Es HD
          mainGrad.addColorStop(0, '#03045e');
          mainGrad.addColorStop(0.3, '#90e0ef');
          mainGrad.addColorStop(0.7, '#caf0f8');
          mainGrad.addColorStop(1, '#03045e');
        } else { // Pilar Neon Cyber City
          mainGrad.addColorStop(0, '#4a0e17');
          mainGrad.addColorStop(0.5, '#f72585');
          mainGrad.addColorStop(1, '#4a0e17');
        }

        ctx.shadowBlur = 10;
        ctx.shadowColor = 'rgba(0,0,0,0.5)';

        // Pilar Atas & Bawah
        ctx.fillStyle = mainGrad;
        ctx.fillRect(this.x, 0, this.width, this.topHeight);
        ctx.fillRect(this.x, this.bottomY, this.width, canvas.height - this.bottomY - 40);

        // Frame Pinggir / Cap Pilar HD
        ctx.fillStyle = '#ffffff';
        ctx.globalAlpha = 0.3;
        ctx.fillRect(this.x, this.topHeight - 20, this.width, 20);
        ctx.fillRect(this.x, this.bottomY, this.width, 20);
        ctx.globalAlpha = 1.0;

        ctx.shadowBlur = 0;
      }

      update() {
        this.x -= this.speed;
      }
    }

    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.radius = Math.random() * 3 + 2;
        this.vx = (Math.random() - 0.5) * 8;
        this.vy = (Math.random() - 0.5) * 8;
        this.alpha = 1;
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= 0.015;
      }
    }

    function spawnFireworks() {
      const colors = ['#ff0055', '#00f0ff', '#ffd700', '#ff9900', '#a855f7'];
      const x = Math.random() * canvas.width;
      const y = Math.random() * (canvas.height / 2);
      const color = colors[Math.floor(Math.random() * colors.length)];

      for (let i = 0; i < 25; i++) {
        fireworks.push(new Particle(x, y, color));
      }
    }

    // GAMBAR LATAR BELAKANG HD BERTEKSTUR LENGKAP
    function drawHDBackground() {
      let bgImg;

      if (score < 5) {
        locationText.textContent = "Tepi Pantai HD 🌊";
        bgImg = images.bgPark;
      } else if (score >= 5 && score < 10) {
        locationText.textContent = "Gurun Pasir HD 🏜️";
        bgImg = images.bgDesert;
      } else if (score >= 10 && score < 15) {
        locationText.textContent = "Pegunungan Salju HD ❄️";
        bgImg = images.bgSnow;
      } else {
        locationText.textContent = "Kota Malam HD 🏙️";
        bgImg = images.bgCity;
      }

      // Gambar Foto HD Memenuhi Canvas
      if (bgImg && bgImg.complete) {
        ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
      } else {
        ctx.fillStyle = '#111';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      // Lapisan Tanah / Landasan HD
      let groundGrad = ctx.createLinearGradient(0, canvas.height - 40, 0, canvas.height);
      groundGrad.addColorStop(0, 'rgba(30, 30, 30, 0.8)');
      groundGrad.addColorStop(1, 'rgba(0, 0, 0, 0.95)');
      ctx.fillStyle = groundGrad;
      ctx.fillRect(0, canvas.height - 40, canvas.width, 40);

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, canvas.height - 40);
      ctx.lineTo(canvas.width, canvas.height - 40);
      ctx.stroke();
    }

    function initGame() {
      resizeCanvas();
      bird = new Bird();
      pipes = [];
      fireworks = [];
      score = 0;
      frameCount = 0;
      scoreText.textContent = score;
      isGameRunning = true;

      if (gameAnimationId) cancelAnimationFrame(gameAnimationId);
      animate();
    }

    function gameWin() {
      isGameRunning = false;
      playWinSound();
      cancelAnimationFrame(gameAnimationId);

      function showVictoryScreen() {
        drawHDBackground();

        if (Math.random() < 0.2) spawnFireworks();

        fireworks.forEach((p, index) => {
          p.update();
          p.draw();
          if (p.alpha <= 0) fireworks.splice(index, 1);
        });

        ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.shadowBlur = 20;
        ctx.shadowColor = '#ffd700';
        ctx.fillStyle = '#ffd700';
        ctx.font = 'bold 50px Segoe UI';
        ctx.textAlign = 'center';
        ctx.fillText('GAME TAMAT! YOU WIN!', canvas.width / 2, canvas.height / 2 - 20);

        ctx.shadowBlur = 0;
        ctx.fillStyle = '#ffffff';
        ctx.font = '22px Segoe UI';
        ctx.fillText('Selamat! Kamu menamatkan BAINI Flappy Bird versi HD!', canvas.width / 2, canvas.height / 2 + 30);
        ctx.fillText('Tekan SPASI untuk main lagi dari awal', canvas.width / 2, canvas.height / 2 + 75);

        requestAnimationFrame(showVictoryScreen);
      }

      showVictoryScreen();
    }

    function gameOver() {
      playBeep(130, 'sawtooth', 0.4);
      isGameRunning = false;
      cancelAnimationFrame(gameAnimationId);

      ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.shadowBlur = 10;
      ctx.shadowColor = '#ff0055';
      ctx.fillStyle = '#ff0055';
      ctx.font = 'bold 42px Segoe UI';
      ctx.textAlign = 'center';
      ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 15);

      ctx.shadowBlur = 0;
      ctx.fillStyle = '#fff';
      ctx.font = '20px Segoe UI';
      ctx.fillText('Tekan tombol SPASI untuk mencoba lagi', canvas.width / 2, canvas.height / 2 + 30);
    }

    function animate() {
      if (!isGameRunning) return;

      drawHDBackground();

      frameCount++;
      if (frameCount % 105 === 0) {
        pipes.push(new Pipe());
      }

      pipes.forEach((pipe, index) => {
        pipe.update();
        pipe.draw();

        if (
          bird.x + bird.radius > pipe.x &&
          bird.x - bird.radius < pipe.x + pipe.width &&
          (bird.y - bird.radius < pipe.topHeight || bird.y + bird.radius > pipe.bottomY)
        ) {
          gameOver();
        }

        if (!pipe.passed && pipe.x + pipe.width < bird.x) {
          pipe.passed = true;
          score++;
          scoreText.textContent = score;
          playBeep(900, 'sine', 0.1);

          if (score > highScore) {
            highScore = score;
            highScoreText.textContent = highScore;
            localStorage.setItem('bainiFlappyHighScore', highScore);
          }

          if (score >= TARGET_SCORE) {
            gameWin();
            return;
          }
        }

        if (pipe.x + pipe.width < 0) {
          pipes.splice(index, 1);
        }
      });

      bird.update();
      bird.draw();

      gameAnimationId = requestAnimationFrame(animate);
    }

    window.addEventListener('keydown', e => {
      if (e.code === 'Space' || e.key === 'ArrowUp') {
        e.preventDefault();
        if (isGameRunning) {
          bird.flap();
        } else {
          initGame();
        }
      }
    });

    window.addEventListener('resize', () => {
      resizeCanvas();
    });

    window.onload = initGame;
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARBAINI - Adventure Quest</title>
  <style>
    /* --- CSS: LAYAR PENUH & DESAIN NEON CYBER ADVENTURE --- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #060913;
      color: #fff;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow: hidden;
      padding: 15px;
    }

    header {
      width: 100%;
      max-width: 1200px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
    }

    .brand-title {
      display: flex;
      flex-direction: column;
    }

    .brand-name {
      font-size: 0.9rem;
      letter-spacing: 3px;
      color: #ff007f;
      text-transform: uppercase;
      font-weight: bold;
      text-shadow: 0 0 8px #ff007f;
    }

    h1 {
      font-size: 2rem;
      color: #00f0ff;
      text-shadow: 0 0 10px #00f0ff, 0 0 20px #00f0ff;
      animation: pulseGlow 2s infinite alternate;
    }

    .score-board {
      font-size: 1.1rem;
      display: flex;
      gap: 20px;
      background: rgba(255, 255, 255, 0.05);
      padding: 8px 20px;
      border-radius: 20px;
      border: 1px solid rgba(0, 240, 255, 0.3);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
    }

    .score-board span {
      color: #ffd700;
      font-weight: bold;
    }

    .game-container {
      position: relative;
      flex: 1;
      width: 100%;
      max-width: 1200px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 10px;
    }

    #gameCanvas {
      background: #0b1120;
      border: 2px solid #00f0ff;
      border-radius: 12px;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.3), inset 0 0 20px rgba(0, 0, 0, 0.9);
      max-width: 100%;
      max-height: 100%;
    }

    footer {
      display: flex;
      align-items: center;
      gap: 25px;
    }

    .btn {
      padding: 10px 30px;
      font-size: 1rem;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(45deg, #00f0ff, #7928ca);
      border: none;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
      transition: all 0.3s ease;
    }

    .btn:hover {
      transform: translateY(-2px) scale(1.05);
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.8);
    }

    .controls-hint {
      font-size: 0.9rem;
      color: #aaa;
    }

    @keyframes pulseGlow {
      0% { text-shadow: 0 0 10px #00f0ff; }
      100% { text-shadow: 0 0 20px #ff007f; }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">
      <span class="brand-name">Game Petualangan</span>
      <h1>ARBAINI ADVENTURE QUEST</h1>
    </div>

    <div class="score-board">
      <div>Permata: <span id="gemsText">0 / 0</span></div>
      <div>Level: <span id="levelText">1</span></div>
    </div>
  </header>

  <div class="game-container">
    <canvas id="gameCanvas"></canvas>
  </div>

  <footer>
    <button class="btn" id="startBtn">Mulai Petualangan</button>
    <div class="controls-hint">Gunakan <b>Panah (Arrow Keys) / WASD</b> untuk mengendalikan Petualang!</div>
  </footer>

  <script>
    /* --- JAVASCRIPT: LOGIKA PETUALANGAN --- */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const gemsText = document.getElementById('gemsText');
    const levelText = document.getElementById('levelText');
    const startBtn = document.getElementById('startBtn');

    let currentLevel = 1;
    let collectedGems = 0;
    let totalGems = 0;
    let gameAnimationId = null;
    let isGameRunning = false;
    let portalActive = false;

    // Web Audio API
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, type = 'sine', duration = 0.1) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function resizeCanvas() {
      const container = document.querySelector('.game-container');
      canvas.width = container.clientWidth;
      canvas.height = container.clientHeight;
    }

    let player, gems, monsters, portal, keys = {};

    // Karakter Petualang
    class Hero {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.radius = 16;
        this.speed = 5;
      }

      draw() {
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#00f0ff';
        ctx.fillStyle = '#00f0ff';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();

        // Mahkota/Indikator Hero
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(this.x, this.y, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      update() {
        if ((keys['ArrowLeft'] || keys['a'] || keys['A']) && this.x - this.radius > 0) this.x -= this.speed;
        if ((keys['ArrowRight'] || keys['d'] || keys['D']) && this.x + this.radius < canvas.width) this.x += this.speed;
        if ((keys['ArrowUp'] || keys['w'] || keys['W']) && this.y - this.radius > 0) this.y -= this.speed;
        if ((keys['ArrowDown'] || keys['s'] || keys['S']) && this.y + this.radius < canvas.height) this.y += this.speed;
      }
    }

    // Item Permata Harta Karun
    class Gem {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.radius = 10;
        this.angle = 0;
      }

      draw() {
        this.angle += 0.05;
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);

        ctx.shadowBlur = 12;
        ctx.shadowColor = '#ffd700';
        ctx.fillStyle = '#ffd700';
        ctx.beginPath();
        ctx.rect(-7, -7, 14, 14);
        ctx.fill();

        ctx.restore();
        ctx.shadowBlur = 0;
      }
    }

    // Monster Penjaga
    class Monster {
      constructor(x, y, dx, dy) {
        this.x = x;
        this.y = y;
        this.radius = 18;
        this.dx = dx;
        this.dy = dy;
      }

      draw() {
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#ff0055';
        ctx.fillStyle = '#ff0055';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      update() {
        this.x += this.dx;
        this.y += this.dy;

        // Pantulan dari dinding
        if (this.x - this.radius < 0 || this.x + this.radius > canvas.width) this.dx *= -1;
        if (this.y - this.radius < 0 || this.y + this.radius > canvas.height) this.dy *= -1;
      }
    }

    // Portal Sihir Ke Level Berikutnya
    class Portal {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.radius = 25;
        this.angle = 0;
      }

        this

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARBAINI - Auto Space Shooter</title>
  <style>
    /* --- CSS: LAYAR PENUH & TEMA CYBER SPACE --- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #05050a;
      color: #fff;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow: hidden;
      padding: 15px;
    }

    header {
      width: 100%;
      max-width: 1200px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
    }

    .brand-title {
      display: flex;
      flex-direction: column;
    }

    .brand-name {
      font-size: 0.9rem;
      letter-spacing: 3px;
      color: #ff0055;
      text-transform: uppercase;
      font-weight: bold;
      text-shadow: 0 0 8px #ff0055;
    }

    h1 {
      font-size: 2rem;
      color: #00f0ff;
      text-shadow: 0 0 10px #00f0ff, 0 0 20px #00f0ff;
      animation: pulseGlow 2s infinite alternate;
    }

    .score-board {
      font-size: 1.1rem;
      display: flex;
      gap: 20px;
      background: rgba(255, 255, 255, 0.05);
      padding: 8px 20px;
      border-radius: 20px;
      border: 1px solid rgba(0, 240, 255, 0.3);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
    }

    .score-board span {
      color: #ff0055;
      font-weight: bold;
    }

    .game-container {
      position: relative;
      flex: 1;
      width: 100%;
      max-width: 1200px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 10px;
    }

    #gameCanvas {
      background: #0a0a16;
      border: 2px solid #00f0ff;
      border-radius: 12px;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.3), inset 0 0 20px rgba(0, 0, 0, 0.9);
      max-width: 100%;
      max-height: 100%;
    }

    footer {
      display: flex;
      align-items: center;
      gap: 25px;
    }

    .btn {
      padding: 10px 30px;
      font-size: 1rem;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(45deg, #ff0055, #7928ca);
      border: none;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(255, 0, 85, 0.5);
      transition: all 0.3s ease;
    }

    .btn:hover {
      transform: translateY(-2px) scale(1.05);
      box-shadow: 0 0 25px rgba(255, 0, 85, 0.8);
    }

    .controls-hint {
      font-size: 0.9rem;
      color: #aaa;
    }

    @keyframes pulseGlow {
      0% { text-shadow: 0 0 10px #00f0ff; }
      100% { text-shadow: 0 0 20px #ff0055; }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">
      <span class="brand-name">Game Arcade</span>
      <h1>ARBAINI SPACE DEFENDER</h1>
    </div>

    <div class="score-board">
      <div>Skor: <span id="score">0</span></div>
      <div>Rekor Arbaini: <span id="highScore">0</span></div>
    </div>
  </header>

  <div class="game-container">
    <canvas id="gameCanvas"></canvas>
  </div>

  <footer>
    <button class="btn" id="startBtn">Mulai Permainan</button>
    <div class="controls-hint">Gunakan <b>Panah Kiri/Kanan</b> untuk bergerak. Tahan <b>Spasi</b> untuk menembak cepat!</div>
  </footer>

  <script>
    /* --- JAVASCRIPT: UTILS & LOGIKA GAME --- */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('highScore');
    const startBtn = document.getElementById('startBtn');

    let highScore = localStorage.getItem('arbainiSpaceHighScore') || 0;
    let gameAnimationId = null;
    let isGameRunning = false;

    let shootCooldown = 0;
    const shootSpeed = 8; // Makin kecil nilainya, makin cepat nembaknya!

    highScoreEl.textContent = highScore;

    function resizeCanvas() {
      const container = document.querySelector('.game-container');
      canvas.width = container.clientWidth;
      canvas.height = container.clientHeight;
    }

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playBeep(freq, type = 'sine', duration = 0.08) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    let bullets = [];

    let particles = [];
    let keys = {};

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BAINI - Flappy Bird Cyberpunk Neon</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090614;
      color: #fff;
    }

    /* Antarmuka Melayang (HUD Glassmorphism) Seperti di Gambar */
    .hud {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(15, 10, 30, 0.65);
      border: 1px solid rgba(0, 240, 255, 0.3);
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.2), inset 0 0 15px rgba(255, 0, 127, 0.15);
      border-radius: 16px;
      padding: 15px 25px;
      backdrop-filter: blur(10px);
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .hud-row {
      font-size: 1.1rem;
      font-weight: bold;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hud-location { color: #00f0ff; text-shadow: 0 0 8px #00f0ff; }
    .hud-score { color: #ffffff; text-shadow: 0 0 8px #ffffff; }
    .hud-highscore { color: #ff007f; text-shadow: 0 0 8px #ff007f; }

    /* Canvas Game Memenuhi Seluruh Layar Desktop */
    #gameCanvas {
      width: 100vw;
      height: 100vh;
      display: block;
    }

    /* Kotak Petunjuk Bawah */
    .controls-hint {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 10, 30, 0.7);
      border: 1px solid rgba(0, 240, 255, 0.4);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
      padding: 10px 24px;
      border-radius: 20px;
      font-size: 1rem;
      font-weight: bold;
      letter-spacing: 2px;
      color: #00f0ff;
      text-shadow: 0 0 6px #00f0ff;
      pointer-events: none;
      backdrop-filter: blur(8px);
    }

    .controls-hint span {
      color: #ffd700;
      text-shadow: 0 0 6px #ffd700;
    }
  </style>
</head>
<body>

  <div class="hud">
    <div class="hud-row hud-location">LOKASI: <span id="locationText">KOTA MALAM 🏙️</span></div>
    <div class="hud-row hud-score">SKOR: <span id="scoreText">0</span></div>
    <div class="hud-row hud-highscore">REKOR BAINI: <span id="highScoreText">0</span></div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <div class="controls-hint">TEKAN <span>SPASI</span> / <span>⬆</span> UNTUK TERBANG!</div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreText = document.getElementById('scoreText');
    const highScoreText = document.getElementById('highScoreText');
    const locationText = document.getElementById('locationText');

    const TARGET_SCORE = 20;
    let score = 0;
    let highScore = localStorage.getItem('bainiFlappyHighScore') || 0;
    let gameAnimationId = null;
    let isGameRunning = true;
    let frameCount = 0;

    highScoreText.textContent = highScore;

    // Web Audio API
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, type = 'sine', duration = 0.08) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function playWinSound() {
      playBeep(523.25, 'triangle', 0.15);
      setTimeout(() => playBeep(659.25, 'triangle', 0.15), 150);
      setTimeout(() => playBeep(783.99, 'triangle', 0.15), 300);
      setTimeout(() => playBeep(1046.50, 'triangle', 0.3), 450);
    }

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    let bird;
    let pipes = [];
    let stars = [];
    let flyingCars = [];
    let fireworks = [];

    // Inisialisasi Bintang & Mobil Terbang Latar
    function initSkyElements() {
      stars = [];
      for (let i = 0; i < 70; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * (canvas.height * 0.5),
          r: Math.random() * 1.5 + 0.5,
          alpha: Math.random()
        });
      }

      flyingCars = [];
      for (let i = 0; i < 4; i++) {
        flyingCars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * (canvas.height * 0.3) + 80,
          speed: Math.random() * 2 + 1.5,
          color: i % 2 === 0 ? '#00f0ff' : '#ff007f'
        });
      }
    }

    class Bird {
      constructor() {
        this.x = 180;
        this.y = canvas.height / 2;
        this.radius = 18;
        this.gravity = 0.42;
        this.velocity = 0;
        this.jumpPower = -8.2;
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(Math.min(Math.PI / 4, Math.max(-Math.PI / 4, this.velocity * 0.08)));

        // Glow Neon Kuning/Orange
        ctx.shadowBlur = 25;
        ctx.shadowColor = '#ffea00';

        // Badan Neon
        ctx.fillStyle = '#ffea00';
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fill();

        // Garis Luar Neon Tegas
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        ctx.shadowBlur = 0;

        // Sayap Neon
        ctx.fillStyle = '#ff9100';
        ctx.beginPath();
        ctx.ellipse(-6, 2, 9, 5, 0, 0, Math.PI * 2);
        ctx.fill();

        // Mata
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(6, -5, 5, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#000000';
        ctx.beginPath();
        ctx.arc(8, -5, 2, 0, Math.PI * 2);
        ctx.fill();

        // Paruh Neon Merah/Oranye
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#ff3d00';
        ctx.fillStyle = '#ff3d00';
        ctx.beginPath();
        ctx.moveTo(10, -2);
        ctx.lineTo(22, 2);
        ctx.lineTo(10, 7);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
      }

      flap() {
        this.velocity = this.jumpPower;
        playBeep(650, 'triangle', 0.06);
      }

      update() {
        this.velocity += this.gravity;
        this.y += this.velocity;

        if (this.y + this.radius >= canvas.height - 60 || this.y - this.radius <= 0) {
          gameOver();
        }
      }
    }

    class Pipe {
      constructor() {
        this.x = canvas.width;
        this.width = 90;
        this.gap = 210;
        this.topHeight = Math.random() * (canvas.height - this.gap - 280) + 80;
        this.bottomY = this.topHeight + this.gap;
        this.speed = 3.8;
        this.passed = false;
      }

      draw() {
        ctx.save();

        // Glow Magenta Neon
        ctx.shadowBlur = 20;
        ctx.shadowColor = '#d800a6';

        // Pipa Utama
        let pipeGrad = ctx.createLinearGradient(this.x, 0, this.x + this.width, 0);
        pipeGrad.addColorStop(0, '#590048');
        pipeGrad.addColorStop(0.5, '#d800a6');
        pipeGrad.addColorStop(1, '#590048');

        ctx.fillStyle = pipeGrad;
        ctx.fillRect(this.x, 0, this.width, this.topHeight);
        ctx.fillRect(this.x, this.bottomY, this.width, canvas.height - this.bottomY - 60);

        // Ring Neon Cyan di Sendi Pipa
        ctx.shadowColor = '#00f0ff';
        ctx.fillStyle = '#00f0ff';
        ctx.fillRect(this.x - 5, this.topHeight - 25, this.width + 10, 25);
        ctx.fillRect(this.x - 5, this.bottomY, this.width + 10, 25);

        // Tekstur Garis Heksagon / Strip Neon
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
        ctx.fillRect(this.x + 10, this.topHeight - 18, this.width - 20, 4);
        ctx.fillRect(this.x + 10, this.bottomY + 14, this.width - 20, 4);

        ctx.restore();
      }

      update() {
        this.x -= this.speed;
      }
    }

    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.radius = Math.random() * 3 + 2;
        this.vx = (Math.random() - 0.5) * 8;
        this.vy = (Math.random() - 0.5) * 8;
        this.alpha = 1;
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= 0.015;
      }
    }

    function spawnFireworks() {
      const colors = ['#ff007f', '#00f0ff', '#ffd700', '#7000ff'];
      const x = Math.random() * canvas.width;
      const y = Math.random() * (canvas.height / 2);
      const color = colors[Math.floor(Math.random() * colors.length)];

      for (let i = 0; i < 25; i++) {
        fireworks.push(new Particle(x, y, color));
      }
    }

    // GAMBAR LATAR BELAKANG CYBERPUNK NEON CITY (PERSIS SEPERTI GAMBAR)
    function drawCyberpunkBackground() {
      // Langit Malam Ungu Gelap
      let skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
      skyGradient.addColorStop(0, '#090412');
      skyGradient.addColorStop(0.5, '#180a29');
      skyGradient.addColorStop(1, '#2c0b3f');
      ctx.fillStyle = skyGradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Bulan Sabit Neon
      ctx.fillStyle = '#e0f7fa';
      ctx.shadowBlur = 15;
      ctx.shadowColor = '#00f0ff';
      ctx.beginPath();
      ctx.arc(canvas.width - 160, 110, 32, 0, Math.PI * 2);
      ctx.fill();

      // Bayangan Cekungan Bulan
      ctx.fillStyle = '#110620';
      ctx.shadowBlur = 0;
      ctx.beginPath();
      ctx.arc(canvas.width - 170, 102, 28, 0, Math.PI * 2);
      ctx.fill();

      // Bintang-bintang
      ctx.fillStyle = '#ffffff';
      stars.forEach(s => {
        ctx.globalAlpha = s.alpha;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1.0;

      // Mobil Terbang & Jejak Cahaya
      flyingCars.forEach(car => {
        car.x -= car.speed;
        if (car.x < -100) car.x = canvas.width + 100;

        ctx.shadowBlur = 10;
        ctx.shadowColor = car.color;
        ctx.fillStyle = car.color;
        ctx.fillRect(car.x, car.y, 20, 4);

        // Jejak Cahaya
        ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
        ctx.fillRect(car.x + 20, car.y + 1, 35, 2);
        ctx.shadowBlur = 0;
      });

      // Gedung-gedung Latar Belakang (Siluet & Jendela Neon)
      for (let x = 0; x < canvas.width + 100; x += 110) {
        let bHeight = 280 + Math.sin(x) * 60;
        ctx.fillStyle = '#0e081d';
        ctx.fillRect(x, canvas.height - bHeight, 95, bHeight - 60);

        // Garis Tepian Gedung Neon
        ctx.strokeStyle = 'rgba(0, 240, 255, 0.15)';
        ctx.strokeRect(x, canvas.height - bHeight, 95, bHeight - 60);

        // Jendela Menyala
        ctx.fillStyle = 'rgba(255, 215, 0, 0.6)';
        for (let wy = canvas.height - bHeight + 20; wy < canvas.height - 80; wy += 35) {
          if ((x + wy) % 3 === 0) {
            ctx.fillRect(x + 18, wy, 18, 14);
            ctx.fillRect(x + 55, wy, 18, 14);
          }
        }
      }

      // Jalan Raya & Trotoar Bawah
      let roadGradient = ctx.createLinearGradient(0, canvas.height - 60, 0, canvas.height);
      roadGradient.addColorStop(0, '#12101d');
      roadGradient.addColorStop(1, '#05040a');
      ctx.fillStyle = roadGradient;
      ctx.fillRect(0, canvas.height - 60, canvas.width, 60);

      // Garis Pembatas Jalan Neon Cyan
      ctx.shadowBlur = 12;
      ctx.shadowColor = '#00f0ff';
      ctx.strokeStyle = '#00f0ff';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, canvas.height - 60);
      ctx.lineTo(canvas.width, canvas.height - 60);
      ctx.stroke();

      // Garis Putus-putus Jalan Raya
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#ffffff';
      let offset = (frameCount * 3) % 60;
      for (let x = -60; x < canvas.width + 60; x += 60) {
        ctx.fillRect(x - offset, canvas.height - 30, 30, 4);
      }
    }

    function initGame() {
      resizeCanvas();
      initSkyElements();
      bird = new Bird();
      pipes = [];
      fireworks = [];
      score = 0;
      frameCount = 0;
      scoreText.textContent = score;
      isGameRunning = true;

      if (gameAnimationId) cancelAnimationFrame(gameAnimationId);
      animate();
    }

    function gameWin() {
      isGameRunning = false;
      playWinSound();
      cancelAnimationFrame(gameAnimationId);

      function showVictoryScreen() {
        drawCyberpunkBackground();

        if (Math.random() < 0.2) spawnFireworks();

        fireworks.forEach((p, index) => {
          p.update();
          p.draw();
          if (p.alpha <= 0) fireworks.splice(index, 1);
        });

        ctx.fillStyle = 'rgba(5, 3, 12, 0.75)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.shadowBlur = 20;
        ctx.shadowColor = '#00f0ff';
        ctx.fillStyle = '#00f0ff';
        ctx.font = 'bold 50px Segoe UI';
        ctx.textAlign = 'center';
        ctx.fillText('GAME TAMAT! YOU WIN!', canvas.width / 2, canvas.height / 2 - 20);

        ctx.shadowBlur = 0;
        ctx.fillStyle = '#ffffff';
        ctx.font = '22px Segoe UI';
        ctx.fillText('Selamat! Kamu berhasil menamatkan BAINI Flappy Bird Cyberpunk!', canvas.width / 2, canvas.height / 2 + 30);
        ctx.fillText('Tekan SPASI untuk main lagi dari awal', canvas.width / 2, canvas.height / 2 + 75);

        requestAnimationFrame(showVictoryScreen);
      }

      showVictoryScreen();
    }

    function gameOver() {
      playBeep(130, 'sawtooth', 0.4);
      isGameRunning = false;
      cancelAnimationFrame(gameAnimationId);

      ctx.fillStyle = 'rgba(5, 3, 12, 0.75)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.shadowBlur = 15;
      ctx.shadowColor = '#ff007f';
      ctx.fillStyle = '#ff007f';
      ctx.font = 'bold 45px Segoe UI';
      ctx.textAlign = 'center';
      ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 15);

      ctx.shadowBlur = 0;
      ctx.fillStyle = '#fff';
      ctx.font = '20px Segoe UI';
      ctx.fillText('Tekan tombol SPASI untuk mencoba lagi', canvas.width / 2, canvas.height / 2 + 30);
    }

    function animate() {
      if (!isGameRunning) return;

      drawCyberpunkBackground();

      frameCount++;
      if (frameCount % 105 === 0) {
        pipes.push(new Pipe());
      }

      pipes.forEach((pipe, index) => {
        pipe.update();
        pipe.draw();

        if (
          bird.x + bird.radius > pipe.x &&
          bird.x - bird.radius < pipe.x + pipe.width &&
          (bird.y - bird.radius < pipe.topHeight || bird.y + bird.radius > pipe.bottomY)
        ) {
          gameOver();
        }

        if (!pipe.passed && pipe.x + pipe.width < bird.x) {
          pipe.passed = true;
          score++;
          scoreText.textContent = score;
          playBeep(900, 'sine', 0.1);

          if (score > highScore) {
            highScore = score;
            highScoreText.textContent = highScore;
            localStorage.setItem('bainiFlappyHighScore', highScore);
          }

          if (score >= TARGET_SCORE) {
            gameWin();
            return;
          }
        }

        if (pipe.x + pipe.width < 0) {
          pipes.splice(index, 1);
        }
      });

      bird.update();
      bird.draw();

      gameAnimationId = requestAnimationFrame(animate);
    }

    window.addEventListener('keydown', e => {
      if (e.code === 'Space' || e.key === 'ArrowUp') {
        e.preventDefault();
        if (isGameRunning) {
          bird.flap();
        } else {
          initGame();
        }
      }
    });

    window.addEventListener('resize', () => {
      resizeCanvas();
    });

    window.onload = initGame;
  </script>
</body>
</html>

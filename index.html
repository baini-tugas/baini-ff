<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARBAINI - Neon Snake Game</title>
  <style>
    /* --- CSS: DESAIN NEON & ANIMASI --- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #090a0f;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Sub-judul Nama */
    .brand-name {
      font-size: 1.2rem;
      letter-spacing: 4px;
      color: #ff007f;
      text-transform: uppercase;
      font-weight: bold;
      margin-bottom: 2px;
      text-shadow: 0 0 10px #ff007f;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      color: #00f0ff;
      text-shadow: 0 0 10px #00f0ff, 0 0 20px #00f0ff;
      animation: pulseGlow 2s infinite alternate;
    }

    .score-board {
      font-size: 1.1rem;
      margin-bottom: 15px;
      display: flex;
      gap: 20px;
      background: rgba(255, 255, 255, 0.05);
      padding: 8px 20px;
      border-radius: 20px;
      border: 1px solid rgba(0, 240, 255, 0.3);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
    }

    .score-board span {
      color: #ff007f;
      font-weight: bold;
    }

    /* Canvas Arena Game */
    #gameCanvas {
      background: #11131e;
      border: 3px solid #00f0ff;
      border-radius: 12px;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.4), inset 0 0 15px rgba(0, 0, 0, 0.8);
    }

    /* Tombol Mulai / Reset */
    .btn {
      margin-top: 20px;
      padding: 12px 30px;
      font-size: 1rem;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(45deg, #ff007f, #7928ca);
      border: none;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.5);
      transition: all 0.3s ease;
    }

    .btn:hover {
      transform: translateY(-2px) scale(1.05);
      box-shadow: 0 0 25px rgba(255, 0, 127, 0.8);
    }

    .controls-hint {
      margin-top: 12px;
      font-size: 0.85rem;
      color: #888;
    }

    /* Keyframe Animasi Judul */
    @keyframes pulseGlow {
      0% { text-shadow: 0 0 10px #00f0ff, 0 0 20px #00f0ff; }
      100% { text-shadow: 0 0 15px #ff007f, 0 0 30px #ff007f; }
    }
  </style>
</head>
<body>

  <div class="brand-name">Website Permainan</div>
  <h1>ARBAINI NEON SNAKE</h1>

  <div class="score-board">
    <div>Skor: <span id="score">0</span></div>
    <div>Rekor Arbaini: <span id="highScore">0</span></div>
  </div>

  <canvas id="gameCanvas" width="400" height="400"></canvas>

  <button class="btn" id="startBtn">Mulai Permainan</button>
  <div class="controls-hint">Gunakan tombol Panah (Arrow Keys) / WASD di keyboard</div>

  <script>
    /* --- JAVASCRIPT: LOGIKA GAME & AUDIO --- */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('highScore');
    const startBtn = document.getElementById('startBtn');

    const gridSize = 20;
    const tileCount = canvas.width / gridSize;

    let snake = [];
    let food = { x: 15, y: 15 };
    let dx = gridSize;
    let dy = 0;
    let score = 0;
    let highScore = localStorage.getItem('arbainiSnakeHighScore') || 0;
    let gameInterval = null;
    let isGameRunning = false;

    highScoreEl.textContent = highScore;

    // Web Audio API untuk efek suara tanpa file eksternal
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playBeep(freq, type = 'sine', duration = 0.1) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function initGame() {
      snake = [
        { x: 10 * gridSize, y: 10 * gridSize },
        { x: 9 * gridSize, y: 10 * gridSize },
        { x: 8 * gridSize, y: 10 * gridSize }
      ];
      dx = gridSize;
      dy = 0;
      score = 0;
      scoreEl.textContent = score;
      placeFood();
      isGameRunning = true;
      startBtn.textContent = "Reset Game";

      if (gameInterval) clearInterval(gameInterval);
      gameInterval = setInterval(gameLoop, 100);
    }

    function placeFood() {
      food.x = Math.floor(Math.random() * tileCount) * gridSize;
      food.y = Math.floor(Math.random() * tileCount) * gridSize;
      
      // Pastikan makanan tidak muncul di tubuh ular
      snake.forEach(segment => {
        if (segment.x === food.x && segment.y === food.y) placeFood();
      });
    }

    function gameLoop() {
      update();
      draw();
    }

    function update() {
      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      // Menabrak dinding
      if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
        return gameOver();
      }

      // Menabrak tubuh sendiri
      for (let i = 0; i < snake.length; i++) {
        if (head.x === snake[i].x && head.y === snake[i].y) {
          return gameOver();
        }
      }

      snake.unshift(head);

      // Memakan makanan
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        playBeep(600, 'triangle', 0.15); // Suara makan
        if (score > highScore) {
          highScore = score;
          highScoreEl.textContent = highScore;
          localStorage.setItem('arbainiSnakeHighScore', highScore);
        }
        placeFood();
      } else {
        snake.pop();
      }
    }

    function draw() {
      // Bersihkan Canvas
      ctx.fillStyle = '#11131e';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Gambar Makanan (Neon Red Circle)
      ctx.shadowBlur = 15;
      ctx.shadowColor = '#ff007f';
      ctx.fillStyle = '#ff007f';
      ctx.beginPath();
      ctx.arc(food.x + gridSize / 2, food.y + gridSize / 2, gridSize / 2 - 2, 0, Math.PI * 2);
      ctx.fill();

      // Gambar Ular (Neon Cyan Gradient)
      snake.forEach((segment, index) => {
        ctx.shadowBlur = index === 0 ? 15 : 8;
        ctx.shadowColor = index === 0 ? '#00f0ff' : '#00aaff';
        ctx.fillStyle = index === 0 ? '#ffffff' : '#00f0ff';
        ctx.fillRect(segment.x + 1, segment.y + 1, gridSize - 2, gridSize - 2);
      });

      // Reset Shadow
      ctx.shadowBlur = 0;
    }

    function gameOver() {
      playBeep(150, 'sawtooth', 0.4); // Suara kalah
      clearInterval(gameInterval);
      isGameRunning = false;
      
      ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.shadowBlur = 10;
      ctx.shadowColor = '#ff007f';
      ctx.fillStyle = '#ff007f';
      ctx.font = 'bold 30px Segoe UI';
      ctx.textAlign = 'center';
      ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 10);

      ctx.shadowBlur = 0;
      ctx.fillStyle = '#fff';
      ctx.font = '16px Segoe UI';
      ctx.fillText('Klik tombol untuk main lagi', canvas.width / 2, canvas.height / 2 + 25);
    }

    // Kontrol Keyboard
    document.addEventListener('keydown', e => {
      if (!isGameRunning) return;

      if ((e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') && dy === 0) {
        dx = 0; dy = -gridSize;
      } else if ((e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') && dy === 0) {
        dx = 0; dy = gridSize;
      } else if ((e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') && dx === 0) {
        dx = -gridSize; dy = 0;
      } else if ((e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') && dx === 0) {
        dx = gridSize; dy = 0;
      }
    });

    startBtn.addEventListener('click', initGame);
  </script>
</body>
</html>

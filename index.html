<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BAINI - Flappy Bird Multi-Bioma HD Neon</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090614;
      color: #fff;
    }

    /* Antarmuka Melayang (HUD Glassmorphism) */
    .hud {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(15, 10, 30, 0.65);
      border: 1px solid rgba(0, 240, 255, 0.3);
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.2), inset 0 0 15px rgba(255, 0, 127, 0.15);
      border-radius: 16px;
      padding: 15px 25px;
      backdrop-filter: blur(10px);
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .hud-row {
      font-size: 1.1rem;
      font-weight: bold;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hud-location { color: #00f0ff; text-shadow: 0 0 8px #00f0ff; }
    .hud-score { color: #ffffff; text-shadow: 0 0 8px #ffffff; }
    .hud-highscore { color: #ff007f; text-shadow: 0 0 8px #ff007f; }

    #gameCanvas {
      width: 100vw;
      height: 100vh;
      display: block;
    }

    .controls-hint {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 10, 30, 0.7);
      border: 1px solid rgba(0, 240, 255, 0.4);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
      padding: 10px 24px;
      border-radius: 20px;
      font-size: 1rem;
      font-weight: bold;
      letter-spacing: 2px;
      color: #00f0ff;
      text-shadow: 0 0 6px #00f0ff;
      pointer-events: none;
      backdrop-filter: blur(8px);
    }

    .controls-hint span {
      color: #ffd700;
      text-shadow: 0 0 6px #ffd700;
    }
  </style>
</head>
<body>

  <div class="hud">
    <div class="hud-row hud-location">LOKASI: <span id="locationText">TAMAN SUNGAI 🌳</span></div>
    <div class="hud-row hud-score">SKOR: <span id="scoreText">0</span></div>
    <div class="hud-row hud-highscore">REKOR BAINI: <span id="highScoreText">0</span></div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <div class="controls-hint">TEKAN <span>SPASI</span> / <span>⬆</span> UNTUK TERBANG!</div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreText = document.getElementById('scoreText');
    const highScoreText = document.getElementById('highScoreText');
    const locationText = document.getElementById('locationText');

    const TARGET_SCORE = 16; // Game Tamat di Poin 16 (Setelah melewati 4 Lokasi)
    let score = 0;
    let highScore = localStorage.getItem('bainiFlappyHighScore') || 0;
    let gameAnimationId = null;
    let isGameRunning = true;
    let frameCount = 0;

    highScoreText.textContent = highScore;

    // Web Audio API
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, type = 'sine', duration = 0.08) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function playWinSound() {
      playBeep(523.25, 'triangle', 0.15);
      setTimeout(() => playBeep(659.25, 'triangle', 0.15), 150);
      setTimeout(() => playBeep(783.99, 'triangle', 0.15), 300);
      setTimeout(() => playBeep(1046.50, 'triangle', 0.3), 450);
    }

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    let bird;
    let pipes = [];
    let stars = [];
    let flyingCars = [];
    let snowFlakes = [];
    let fireworks = [];

    function initElements() {
      stars = [];
      for (let i = 0; i < 60; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * (canvas.height * 0.5),
          r: Math.random() * 1.5 + 0.5,
          alpha: Math.random()
        });
      }

      flyingCars = [];
      for (let i = 0; i < 3; i++) {
        flyingCars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * (canvas.height * 0.3) + 80,
          speed: Math.random() * 2 + 1.5,
          color: i % 2 === 0 ? '#00f0ff' : '#ff007f'
        });
      }

      snowFlakes = [];
      for (let i = 0; i < 50; i++) {
        snowFlakes.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          r: Math.random() * 2.5 + 1,
          speed: Math.random() * 1.5 + 0.8
        });
      }
    }

    class Bird {
      constructor() {
        this.x = 180;
        this.y = canvas.height / 2;
        this.radius = 18;
        this.gravity = 0.42;
        this.velocity = 0;
        this.jumpPower = -8.2;
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(Math.min(Math.PI / 4, Math.max(-Math.PI / 4, this.velocity * 0.08)));

        ctx.shadowBlur = 25;
        ctx.shadowColor = '#ffea00';

        ctx.fillStyle = '#ffea00';
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        ctx.shadowBlur = 0;

        ctx.fillStyle = '#ff9100';
        ctx.beginPath();
        ctx.ellipse(-6, 2, 9, 5, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(6, -5, 5, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#000000';
        ctx.beginPath();
        ctx.arc(8, -5, 2, 0, Math.PI * 2);
        ctx.fill();

        ctx.shadowBlur = 10;
        ctx.shadowColor = '#ff3d00';
        ctx.fillStyle = '#ff3d00';
        ctx.beginPath();
        ctx.moveTo(10, -2);
        ctx.lineTo(22, 2);
        ctx.lineTo(10, 7);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
      }

      flap() {
        this.velocity = this.jumpPower;
        playBeep(650, 'triangle', 0.06);
      }

      update() {
        this.velocity += this.gravity;
        this.y += this.velocity;

        if (this.y + this.radius >= canvas.height - 60 || this.y - this.radius <= 0) {
          gameOver();
        }
      }
    }

    class Pipe {
      constructor() {
        this.x = canvas.width;
        this.width = 90;
        this.gap = 210;
        this.topHeight = Math.random() * (canvas.height - this.gap - 280) + 80;
        this.bottomY = this.topHeight + this.gap;
        this.speed = 3.8;
        this.passed = false;
      }

      draw() {
        ctx.save();

        let pipeColor1, pipeColor2, glowColor, ringColor;

        // Warna Pipa Berganti Berdasarkan Skor (Kelipatan 4 Poin)
        if (score < 4) { // Taman
          pipeColor1 = '#1b5e20'; pipeColor2 = '#4caf50'; glowColor = '#00ff66'; ringColor = '#a7ffeb';
        } else if (score >= 4 && score < 8) { // Gurun
          pipeColor1 = '#8f531d'; pipeColor2 = '#d4a373'; glowColor = '#ff9e00'; ringColor = '#ffe5ec';
        } else if (score >= 8 && score < 12) { // Salju
          pipeColor1 = '#03045e'; pipeColor2 = '#00b4d8'; glowColor = '#00f0ff'; ringColor = '#ffffff';
        } else { // Kota Cyberpunk
          pipeColor1 = '#590048'; pipeColor2 = '#d800a6'; glowColor = '#ff007f'; ringColor = '#00f0ff';
        }

        ctx.shadowBlur = 20;
        ctx.shadowColor = glowColor;

        let pipeGrad = ctx.createLinearGradient(this.x, 0, this.x + this.width, 0);
        pipeGrad.addColorStop(0, pipeColor1);
        pipeGrad.addColorStop(0.5, pipeColor2);
        pipeGrad.addColorStop(1, pipeColor1);

        ctx.fillStyle = pipeGrad;
        ctx.fillRect(this.x, 0, this.width, this.topHeight);
        ctx.fillRect(this.x, this.bottomY, this.width, canvas.height - this.bottomY - 60);

        // Ring Neon
        ctx.shadowColor = ringColor;
        ctx.fillStyle = ringColor;
        ctx.fillRect(this.x - 5, this.topHeight - 25, this.width + 10, 25);
        ctx.fillRect(this.x - 5, this.bottomY, this.width + 10, 25);

        ctx.restore();
      }

      update() {
        this.x -= this.speed;
      }
    }

    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.radius = Math.random() * 3 + 2;
        this.vx = (Math.random() - 0.5) * 8;
        this.vy = (Math.random() - 0.5) * 8;
        this.alpha = 1;
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= 0.015;
      }
    }

    function spawnFireworks() {
      const colors = ['#ff007f', '#00f0ff', '#ffd700', '#7000ff'];
      const x = Math.random() * canvas.width;
      const y = Math.random() * (canvas.height / 2);
      const color = colors[Math.floor(Math.random() * colors.length)];

      for (let i = 0; i < 25; i++) {
        fireworks.push(new Particle(x, y, color));
      }
    }

    // SYSTEM CHANGER: Latar Belakang Berganti Setiap 4 Poin
    function drawDynamicBackground() {
      // 1. TAMAN SUNGAI (Skor 0 - 3)
      if (score < 4) {
        locationText.textContent = "TAMAN SUNGAI 🌳";
        let skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
        skyGradient.addColorStop(0, '#023e8a');
        skyGradient.addColorStop(0.5, '#0077b6');
        skyGradient.addColorStop(1, '#1b4332');
        ctx.fillStyle = skyGradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Matahari Neon
        ctx.fillStyle = '#ffd700';
        ctx.shadowBlur = 25;
        ctx.shadowColor = '#ffd700';
        ctx.beginPath();
        ctx.arc(canvas.width - 150, 100, 45, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        // Pohon & Air
        ctx.fillStyle = '#2d6a4f';
        ctx.fillRect(0, canvas.height - 90, canvas.width, 30);
        ctx.fillStyle = '#0077b6';
        ctx.fillRect(0, canvas.height - 60, canvas.width, 60);
      }
      // 2. GURUN PASIR (Skor 4 - 7)
      else if (score >= 4 && score < 8) {
        locationText.textContent = "GURUN PASIR 🏜️";
        let skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
        skyGradient.addColorStop(0, '#3d0066');
        skyGradient.addColorStop(0.5, '#9e0059');
        skyGradient.addColorStop(1, '#ff5400');
        ctx.fillStyle = skyGradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Piramida Latar
        ctx.fillStyle = '#5c2d16';
        ctx.beginPath();
        ctx.moveTo(canvas.width * 0.1, canvas.height - 60);
        ctx.lineTo(canvas.width * 0.35, canvas.height - 240);
        ctx.lineTo(canvas.width * 0.6, canvas.height - 60);
        ctx.fill();

        // Tanah Pasir
        ctx.fillStyle = '#ffb703';
        ctx.fillRect(0, canvas.height - 60, canvas.width, 60);
      }
      // 3. PEGUNUNGAN SALJU (Skor 8 - 11)
      else if (score >= 8 && score < 12) {
        locationText.textContent = "PEGUNUNGAN SALJU ❄️";
        let skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
        skyGradient.addColorStop(0, '#03045e');
        skyGradient.addColorStop(0.6, '#023e8a');
        skyGradient.addColorStop(1, '#90e0ef');
        ctx.fillStyle = skyGradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Efek Salju
        ctx.fillStyle = '#ffffff';
        snowFlakes.forEach(f => {
          f.y += f.speed;
          if (f.y > canvas.height) f.y = 0;
          ctx.beginPath();
          ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
          ctx.fill();
        });

        // Landasan Salju
        ctx.fillStyle = '#e0f7fa';
        ctx.fillRect(0, canvas.height - 60, canvas.width, 60);
      }
      // 4. KOTA CYBERPUNK (Skor 12 - 15)
      else {
        locationText.textContent = "KOTA MALAM 🏙️";
        let skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
        skyGradient.addColorStop(0, '#090412');
        skyGradient.addColorStop(0.5, '#180a29');
        skyGradient.addColorStop(1, '#2c0b3f');
        ctx.fillStyle = skyGradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Bulan Sabit Neon
        ctx.fillStyle = '#e0f7fa';
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#00f0ff';
        ctx.beginPath();
        ctx.arc(canvas.width - 160, 110, 32, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#110620';
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.arc(canvas.width - 170, 102, 28, 0, Math.PI * 2);
        ctx.fill();

        // Gedung-gedung Kota
        for (let x = 0; x < canvas.width + 100; x += 110) {
          let bHeight = 280 + Math.sin(x) * 60;
          ctx.fillStyle = '#0e081d';
          ctx.fillRect(x, canvas.height - bHeight, 95, bHeight - 60);

          ctx.fillStyle = 'rgba(255, 215, 0, 0.6)';
          for (let wy = canvas.height - bHeight + 20; wy < canvas.height - 80; wy += 35) {
            if ((x + wy) % 3 === 0) {
              ctx.fillRect(x + 18, wy, 18, 14);
              ctx.fillRect(x + 55, wy, 18, 14);
            }
          }
        }

        // Jalan Raya
        ctx.fillStyle = '#12101d';
        ctx.fillRect(0, canvas.height - 60, canvas.width, 60);
      }

      // Garis Pembatas Neon Bawah All-Bioma
      ctx.shadowBlur = 12;
      ctx.shadowColor = '#00f0ff';
      ctx.strokeStyle = '#00f0ff';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, canvas.height - 60);
      ctx.lineTo(canvas.width, canvas.height - 60);
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    function initGame() {
      resizeCanvas();
      initElements();
      bird = new Bird();
      pipes = [];
      fireworks = [];
      score = 0;
      frameCount = 0;
      scoreText.textContent = score;
      isGameRunning = true;

      if (gameAnimationId) cancelAnimationFrame(gameAnimationId);
      animate();
    }

    function gameWin() {
      isGameRunning = false;
      playWinSound();
      cancelAnimationFrame(gameAnimationId);

      function showVictoryScreen() {
        drawDynamicBackground();

        if (Math.random() < 0.2) spawnFireworks();

        fireworks.forEach((p, index) => {
          p.update();
          p.draw();
          if (p.alpha <= 0) fireworks.splice(index, 1);
        });

        ctx.fillStyle = 'rgba(5, 3, 12, 0.75)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.shadowBlur = 20;
        ctx.shadowColor = '#00f0ff';
        ctx.fillStyle = '#00f0ff';
        ctx.font = 'bold 50px Segoe UI';
        ctx.textAlign = 'center';
        ctx.fillText('GAME TAMAT! YOU WIN!', canvas.width / 2, canvas.height / 2 - 20);

        ctx.shadowBlur = 0;
        ctx.fillStyle = '#ffffff';
        ctx.font = '22px Segoe UI';
        ctx.fillText('Selamat! Kamu menamatkan BAINI Flappy Bird di semua lokasi!', canvas.width / 2, canvas.height / 2 + 30);
        ctx.fillText('Tekan SPASI untuk main lagi dari awal', canvas.width / 2, canvas.height / 2 + 75);

        requestAnimationFrame(showVictoryScreen);
      }

      showVictoryScreen();
    }

    function gameOver() {
      playBeep(130, 'sawtooth', 0.4);
      isGameRunning = false;
      cancelAnimationFrame(gameAnimationId);

      ctx.fillStyle = 'rgba(5, 3, 12, 0.75)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.shadowBlur = 15;
      ctx.shadowColor = '#ff007f';
      ctx.fillStyle = '#ff007f';
      ctx.font = 'bold 45px Segoe UI';
      ctx.textAlign = 'center';
      ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 15);

      ctx.shadowBlur = 0;
      ctx.fillStyle = '#fff';
      ctx.font = '20px Segoe UI';
      ctx.fillText('Tekan tombol SPASI untuk mencoba lagi', canvas.width / 2, canvas.height / 2 + 30);
    }

    function animate() {
      if (!isGameRunning) return;

      drawDynamicBackground();

      frameCount++;
      if (frameCount % 105 === 0) {
        pipes.push(new Pipe());
      }

      pipes.forEach((pipe, index) => {
        pipe.update();
        pipe.draw();

        if (
          bird.x + bird.radius > pipe.x &&
          bird.x - bird.radius < pipe.x + pipe.width &&
          (bird.y - bird.radius < pipe.topHeight || bird.y + bird.radius > pipe.bottomY)
        ) {
          gameOver();
        }

        if (!pipe.passed && pipe.x + pipe.width < bird.x) {
          pipe.passed = true;
          score++;
          scoreText.textContent = score;
          playBeep(900, 'sine', 0.1);

          if (score > highScore) {
            highScore = score;
            highScoreText.textContent = highScore;
            localStorage.setItem('bainiFlappyHighScore', highScore);
          }

          if (score >= TARGET_SCORE) {
            gameWin();
            return;
          }
        }

        if (pipe.x + pipe.width < 0) {
          pipes.splice(index, 1);
        }
      });

      bird.update();
      bird.draw();

      gameAnimationId = requestAnimationFrame(animate);
    }

    window.addEventListener('keydown', e => {
      if (e.code === 'Space' || e.key === 'ArrowUp') {
        e.preventDefault();
        if (isGameRunning) {
          bird.flap();
        } else {
          initGame();
        }
      }
    });

    window.addEventListener('resize', () => {
      resizeCanvas();
    });

    window.onload = initGame;
  </script>
</body>
</html>
